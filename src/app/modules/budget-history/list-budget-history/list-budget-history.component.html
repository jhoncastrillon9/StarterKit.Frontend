<div class="history-list-container">

  <!-- Panel de filtros (server-side) -->
  <div class="dc-filters">
    <div class="dc-filters__head">
      <i class="fas fa-filter"></i>
      <span>Filtros de búsqueda</span>
    </div>
    <div class="dc-filters__grid">
      <div class="dc-field">
        <label><i class="fas fa-hashtag"></i> Código interno</label>
        <input type="number" [(ngModel)]="internalCodeFilter" placeholder="Ej: 1234" />
      </div>
      <div class="dc-field">
        <label><i class="fas fa-clipboard-list"></i> Descripción del cambio</label>
        <input type="text" [(ngModel)]="logCambioFilter" placeholder="Buscar en log de cambios..." />
      </div>
      <div class="dc-field">
        <label><i class="far fa-calendar-alt"></i> Desde</label>
        <input type="date" [(ngModel)]="fromDateFilter" />
      </div>
      <div class="dc-field">
        <label><i class="far fa-calendar-alt"></i> Hasta</label>
        <input type="date" [(ngModel)]="toDateFilter" />
      </div>
      <div class="dc-filters__actions">
        <button class="dc-btn dc-btn--primary" (click)="applyFilters()" [disabled]="loading">
          <i class="fas fa-search"></i> Buscar
        </button>
        <button class="dc-btn dc-btn--ghost" (click)="clear()" [disabled]="loading">
          <i class="fas fa-eraser"></i> Limpiar
        </button>
      </div>
    </div>
  </div>

  <!-- Tabla reutilizable en modo lazy (paginación backend) -->
  <app-data-table
    #dt
    [columns]="tableColumns"
    [value]="historyItems"
    [loading]="loading"
    rowKey="budgetHistoryId"
    title="Historial de Cotizaciones"
    [subtitle]="totalRecords + ' registros'"
    [showSearch]="false"
    [lazy]="true"
    [totalRecords]="totalRecords"
    [rows]="filterRequest.pageSize"
    [rowsPerPageOptions]="[10, 25, 50, 100]"
    (lazyLoad)="loadHistory($event)">

    <!-- Código -->
    <ng-template dtColumn="internalCode" let-h>
      <span class="code-value">{{ h.internalCode }}</span>
    </ng-template>

    <!-- Fecha (fecha + hora) -->
    <ng-template dtColumn="fecha" let-h>
      <div class="date-cell">
        <span class="date-cell__day">{{ h.fecha | date: 'dd MMM yyyy' }}</span>
        <span class="date-cell__time">{{ h.fecha | date: 'HH:mm' }}</span>
      </div>
    </ng-template>

    <!-- Obra -->
    <ng-template dtColumn="budgetName" let-h>
      <span class="obra-cell">{{ h.budgetName }}</span>
    </ng-template>

    <!-- Estado (pill, no editable) -->
    <ng-template dtColumn="estado" let-h>
      <app-status-pill *ngIf="h.estado" [status]="h.estado"></app-status-pill>
      <span *ngIf="!h.estado" class="cell-dash">—</span>
    </ng-template>

    <!-- Log de cambio -->
    <ng-template dtColumn="logCambio" let-h>
      <div class="log-cell">
        <i class="fas fa-info-circle"></i>
        <span>{{ h.logCambio }}</span>
      </div>
    </ng-template>

    <!-- Acciones -->
    <ng-template dtColumn="acciones" let-h>
      <div class="action-buttons">
        <button class="action-btn action-pdf" (click)="viewBudget(h)" pTooltip="Ver/Descargar PDF" tooltipPosition="top">
          <i class="fas fa-file-pdf"></i>
        </button>
        <button class="action-btn action-restore" (click)="restoreBudgetWithConfirm(h)" pTooltip="Restaurar cotización" tooltipPosition="top">
          <i class="fas fa-undo-alt"></i>
        </button>
      </div>
    </ng-template>

    <!-- Estado vacío -->
    <div dt-empty class="empty-content">
      <i class="fas fa-history empty-icon"></i>
      <h3>No hay registros</h3>
      <p>No se encontraron registros en el historial con los filtros aplicados</p>
    </div>
  </app-data-table>
</div>

<!-- Modal de confirmación -->
<app-confirmation-modal #confirmationModal></app-confirmation-modal>

<ngx-spinner
  bdColor="rgba(0, 0, 0, 0.8)"
  size="medium"
  color="#fff"
  type="square-jelly-box"
  [fullScreen]="true">
  <p style="color: white">Cargando...</p>
</ngx-spinner>
