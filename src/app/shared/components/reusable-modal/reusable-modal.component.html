<!--
  Modal de aviso y confirmación, usado por 18 pantallas.

  Antes pintaba SIEMPRE un check verde, incluso cuando el título era de error, y
  los iconos eran de Bootstrap Icons, una fuente que esta aplicación no carga: se
  veían como cuadrados vacíos. Se usa FontAwesome, que sí está cargada, y el icono
  refleja de qué se está avisando.
-->
<c-modal [visible]="visible" [alignment]="alignmentModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rm-content">

      <button type="button" class="rm-close" (click)="closeModal()" aria-label="Cerrar">
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>

      <div class="modal-body rm-body">
        <!-- El icono dice de un vistazo si esto es un logro, un problema o una pregunta -->
        <div class="rm-icon"
             [class.rm-icon--ok]="!isModalError && !isConfirmation"
             [class.rm-icon--error]="isModalError"
             [class.rm-icon--ask]="isConfirmation && !isModalError">
          <i class="fas"
             [class.fa-circle-check]="!isModalError && !isConfirmation"
             [class.fa-circle-exclamation]="isModalError"
             [class.fa-circle-question]="isConfirmation && !isModalError"
             aria-hidden="true"></i>
        </div>

        <h2 class="rm-title" [class.rm-title--error]="isModalError">{{ title }}</h2>

        <p class="rm-message">{{ messageModal }}</p>
      </div>

      <div class="modal-footer rm-footer">
        <ng-container *ngIf="isConfirmation; else defaultFooter">
          <!-- En una confirmación el rojo sí significa algo: la acción destructiva -->
          <button type="button" class="rm-btn rm-btn--ghost" (click)="closeModal()">Cancelar</button>
          <button type="button" class="rm-btn rm-btn--danger" (click)="confirm()">
            {{ titleButtonComfimationYes || 'Confirmar' }}
          </button>
        </ng-container>

        <ng-template #defaultFooter>
          <!-- Cerrar un aviso no es destructivo: el boton no va en rojo aunque el
               aviso sea de error. El rojo se reserva para lo que borra algo. -->
          <button type="button" class="rm-btn rm-btn--primary" (click)="closeModal()">Entendido</button>
        </ng-template>
      </div>

    </div>
  </div>
</c-modal>
